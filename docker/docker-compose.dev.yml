# 开发: 本地依赖(MySQL[业务库+游戏库结构 fixture] + Redis + Mailpit + SOAP mock)
# 数据落 workspace/(宿主机持久化,重置=删 workspace/<dir> 目录;数据目录重建时才执行 initdb)
# 游戏四库仅结构 fixture + 合成种子,无生产数据(宪法 V)
# 端口 3307/6381: 本机 3306/6379 已被既有 acore 开发环境占用
name: acore-portal-dev

services:
  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: acore_portal
      MYSQL_USER: acore_portal
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acore_portal}
    volumes:
      - ../workspace/mysql-dev:/var/lib/mysql
      - ../scripts/dev/initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - ../workspace/redis-dev:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI(激活/重置邮件捕获)
      - "1025:1025" # SMTP

  soap-mock:
    image: node:22-alpine
    working_dir: /app
    command: node /app/soap-mock.mjs
    environment:
      SOAP_MOCK_PORT: "7878"
      SOAP_MOCK_USER: ${SOAP_USER:-soaper}
      SOAP_MOCK_PASSWORD: ${SOAP_PASSWORD:-change-me}
    volumes:
      - ../scripts/dev:/app:ro
    ports:
      - "7878:7878"
