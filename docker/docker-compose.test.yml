# 测试环境: Mac Mini 常驻栈,公网入口 dev.17aitech.com(frpc → 宿主 9000 → web 容器)
# ⚠️ 测试栈,严禁用于生产:mailpit/soap-mock 是测试替身,initdb 会灌入种子账号(m1admin/adminpass123)
#    生产栈见 docker/docker-compose.prod.yml(独立文件,不含上述容器)
# 与 dev 栈(3307/6381/3000)和生产快照数据完全隔离;DB/缓存/邮件 UI 只绑 127.0.0.1
# 数据落 workspace/mysql-test、workspace/redis-test(重置=删目录重建)
# worldserver/authserver 二期接入:SOAP 暂指栈内 mock,boot 自检 degraded 不阻塞
# 加固口径照内部同族项目的 prod compose:全服务 restart+日志旋转,web 健康检查,TZ 上海
# (mysql 容器保持 UTC:DATETIME 为字面量语义,改时区=存量数据迁移,另案处理)
#
# 【路径参数化】部署根走环境变量,默认值 = 本地开发原路径(零影响):
#   DEPLOY_ROOT —— 部署根目录(默认 `..`,即本仓根);自动部署时指向部署根,
#                  其下含 `.env.test` 与 `workspace/`(持久卷根),**在 git 检出之外**
#   WEB_IMAGE   —— web 镜像 tag(默认与 compose 默认同名);自动部署按 sha 打 tag 以支持秒级回滚
# 自动部署手册见 docs/ops/staging-deploy.md。
name: acore-portal-test

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    # test 无复制/PITR 需求,关 binlog:防 workspace 数据目录 binlog 无限膨胀
    command: --skip-log-bin
    ports:
      - "127.0.0.1:3308:3306" # 快照导入/迁移走本机;禁止 LAN 暴露
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: acore_portal
      MYSQL_USER: acore_portal
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-acore_portal}
    volumes:
      - ${DEPLOY_ROOT:-..}/workspace/mysql-test:/var/lib/mysql
      - ../scripts/dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - ${DEPLOY_ROOT:-..}/workspace/redis-test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8026:8025" # UI;1025 已被 docker-mailpit-1 占用故不发布
    restart: unless-stopped
    logging: *logging

  soap-mock:
    image: node:22-alpine
    working_dir: /app
    command: node /app/soap-mock.mjs
    environment:
      TZ: Asia/Shanghai
      SOAP_MOCK_PORT: "7878"
      SOAP_MOCK_USER: ${SOAP_USER:-soaper}
      SOAP_MOCK_PASSWORD: ${SOAP_PASSWORD:-change-me}
    volumes:
      - ../scripts/dev:/app:ro
    restart: unless-stopped
    logging: *logging

  # 一次性迁移服务(profiles=migrate,默认不起):与生产栈同形态。
  # MySQL 只绑 127.0.0.1(本机可达),迁移可在宿主机直接跑 prisma CLI;
  # 本服务用于「自动部署时容器网络内跑迁移」,不发布任何端口。
  # 用法: docker compose --env-file ../.env.test -f docker/docker-compose.test.yml --profile migrate run --rm migrate
  migrate:
    image: node:22-slim
    profiles: ["migrate"]
    working_dir: /app
    # prisma CLI 是 devDependency,生产镜像里没有(见 docker/web/Dockerfile 的 --prod 瘦身);
    # 这里用 npx 按版本拉取,与 package.json 锁定的 6.19.3 保持一致(改版本须同步)
    command: npx --yes prisma@6.19.3 migrate deploy --schema prisma/schema-business/schema.prisma
    volumes:
      - ../prisma/schema-business:/app/prisma/schema-business:ro
    # 与 web 同一个 env_file:迁移必须打 web 实际在用的那个库(容器网络内的 mysql:3306)。
    # 禁用 ${DATABASE_URL} 插值——compose 插值优先级 shell env > --env-file > .env,
    # CI 作业级 env 会盖掉 .env.test(曾导致 migrate 拿到 127.0.0.1:3306 而 P1001 连不上)
    env_file:
      - ${DEPLOY_ROOT:-..}/.env.test
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  web:
    # 默认 tag 与 compose 默认命名一致(本地开发零影响);自动部署按 sha 打 tag 以支持秒级回滚
    image: ${WEB_IMAGE:-acore-portal-test-web}
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    env_file:
      - ${DEPLOY_ROOT:-..}/.env.test
    environment:
      TZ: Asia/Shanghai # 404 日键/邮件模板按北京日期切;DB 时间戳走驱动会话转换不受影响
    ports:
      - "9000:3000" # frpc dev.17aitech.com → 宿主 9000(必须 0.0.0.0 可达)
    volumes:
      # 无 COS 时的媒体本地上传回退(容器重建不丢图)
      - ${DEPLOY_ROOT:-..}/workspace/uploads:/app/workspace/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      soap-mock:
        condition: service_started
    healthcheck:
      # node:22-slim 无 curl,用内置 fetch;/api/status 探针降级语义恒 200,liveness 口径
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging
