# CI/CD:质量门禁(check)+ 生产构建(build)+ 集成测试(integration)+ 迁移守卫 + 测试环境自动部署
#
# 档位说明:
#   check       —— lint + typecheck + 单元测试(快,每个 PR 必跑)
#   build       —— next build。**独立成 job 是因为它是独立故障域**:
#                  Next 14 会为 instrumentation 额外编译一份 edge 产物,启动链上
#                  出现 node-only 包(ioredis/mysql2/node:*)时 edge 编译报
#                  "Can't resolve 'stream'",dev 与 build 双双失败——这类故障
#                  lint/typecheck/单测全都发现不了(PR-0 曾因此静默炸掉整个 E2E)。
#   integration —— 集成测试(认证/限速/订单/看板等真库用例)。
#                  需 MySQL + Redis 服务容器;游戏四库结构复用 dev 栈同一份 initdb
#                  脚本,CI 不另造 schema/账号口径(scripts/ci/provision.sh)。
#   db-migration-guard / db-incremental-guard —— 迁移守卫(业务库唯一 schema 真相源):
#                  从零重放 / 幂等重放 / 无漂移 / 增量与从零一致 / 新迁移 SQL 可手工重放。
#                  守卫不过 → 绝不部署(详见 docs/ops/staging-deploy.md)。
#   docker-release —— 构建并推送 web 镜像到 TCR(可复用工作流 release-image.yml)。
#                  tag = 分支-提交短号(develop-xxxxxxx / main-xxxxxxx),短 tag 不可变
#                  ⇒ 部署侧可精确回滚到任一历史版本;main 额外打 latest。
#   deploy-staging —— 测试环境自动部署(push develop 时,自托管 runner 落 Mac Mini 常驻栈)。
#   deploy-production —— 生产环境发布(push main 时;**Environment 人工审批后方可执行**;
#                  仓库为 public,主机地址与部署路径一律走仓库变量,SSH 密钥与指纹走仓库 secret)。
#
# 镜像来源与架构:测试栈在 Mac Mini(arm64)原生构建 arm64 镜像、生产栈在 x86_64 机器上拉
# amd64 镜像——**不做交叉模拟**(Next.js 在 QEMU 下运行极慢,不值得为"同一架构"牺牲可用性)。
#
# E2E 单独成档(.github/workflows/e2e.yml):需浏览器与邮件替身,耗时与 flake 面
# 都与上面几档不同量级,拆开便于按需停用而不拖累 PR 反馈。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: '要发布的镜像 tag(留空 = 当前 main 提交短号;填历史 tag 可重发旧版本)'
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # develop 分支不打断在跑的流水线:中断会连带砍掉进行中的部署(半新半旧状态);
  # 新 push 排队接续即可。main/PR 仍按最新一次为准。
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  DATABASE_URL: mysql://acore_portal:acore_portal@127.0.0.1:3306/acore_portal
  REDIS_URL: redis://127.0.0.1:6379/0
  # 单测经 redis 模块触发 env 格式校验(fail-fast,只验存在性不连库),给合规哑元即可
  SESSION_SECRET: ci-only-dummy-secret-value-0001
  MYSQL_ROOT_PASSWORD: root
  CI_MYSQL_PORT: "3306"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成 Prisma 客户端(typecheck 依赖 src/generated)
        run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/unit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成 Prisma 客户端
        run: pnpm db:generate
      # 构建期不连库:instrumentation 在 phase-production-build 直接返回,
      # 页面全部动态渲染(ƒ)→ 无静态化期 DB 访问
      - name: next build(含 edge 产物编译)
        run: pnpm build

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: acore_portal
          MYSQL_USER: acore_portal
          MYSQL_PASSWORD: acore_portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成 Prisma 客户端
        run: pnpm db:generate
      - name: 游戏四库结构与账号
        run: bash scripts/ci/provision.sh game
        env:
          MYSQL_CID: ${{ job.services.mysql.id }}
      - name: 业务库迁移
        run: pnpm db:deploy
      - name: system_config 基线
        run: bash scripts/ci/provision.sh config
        env:
          MYSQL_CID: ${{ job.services.mysql.id }}
      - name: 开发种子
        run: pnpm db:seed
      - name: 启动 SOAP mock(发货管线集成用例依赖)
        run: |
          SOAP_MOCK_PORT=17878 node scripts/dev/soap-mock.mjs > /tmp/soap-mock.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:17878/__mode > /dev/null; then echo "soap-mock 就绪"; exit 0; fi
            sleep 1
          done
          echo "soap-mock 未就绪"; cat /tmp/soap-mock.log; exit 1
      - name: 集成测试
        run: pnpm exec vitest run tests/integration

  # ============================================================
  # 迁移守卫:业务库唯一 schema 真相源(prisma/schema-business)
  # ============================================================

  db-migration-guard:
    name: 迁移守卫 / 从零重放·幂等·无漂移
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: acore_portal
          MYSQL_USER: acore_portal
          MYSQL_PASSWORD: acore_portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GUARD_DB_URL: mysql://root:root@127.0.0.1:3306/guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 静态幂等检查(MySQL 口径)
        run: pnpm lint:migrations
      - name: 建库
        run: docker exec $MYSQL_CID mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE guard"
        env:
          MYSQL_CID: ${{ job.services.mysql.id }}
      - name: 从零重放全部迁移
        run: pnpm exec prisma migrate deploy --schema prisma/schema-business/schema.prisma
        env:
          DATABASE_URL: ${{ env.GUARD_DB_URL }}
      - name: 断言迁移账本(全部应用成功、无回滚)
        run: |
          set -euo pipefail
          read -r total finished rolled <<<"$(docker exec $MYSQL_CID mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B guard \
            -e "SELECT COUNT(*), SUM(finished_at IS NOT NULL), SUM(rolled_back_at IS NOT NULL) FROM _prisma_migrations;" 2>/dev/null)"
          expected="$(find prisma/schema-business/migrations -name migration.sql | wc -l | tr -d ' ')"
          echo "账本: total=$total finished=$finished rolled_back=$rolled 期望条数=$expected"
          [ "$total" = "$expected" ] || { echo "✗ 迁移条数不符(期望 $expected)"; exit 1; }
          [ "$finished" = "$expected" ] || { echo "✗ 有未成功应用的迁移"; exit 1; }
          [ "$rolled" = "0" ] || { echo "✗ 有被回滚的迁移"; exit 1; }
        env:
          MYSQL_CID: ${{ job.services.mysql.id }}
      - name: 幂等重放(再跑一次必须零应用)
        run: |
          set -euo pipefail
          out="$(pnpm exec prisma migrate deploy --schema prisma/schema-business/schema.prisma 2>&1)"
          echo "$out"
          echo "$out" | grep -qi "no pending migrations" || { echo "✗ 二次重放未处于幂等态"; exit 1; }
        env:
          DATABASE_URL: ${{ env.GUARD_DB_URL }}
      - name: 断言无漂移(库结构 = datamodel)
        run: |
          pnpm exec prisma migrate diff --from-url "$GUARD_DB_URL" \
            --to-schema-datamodel prisma/schema-business/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.GUARD_DB_URL }}
      - name: 断言核心表齐备
        run: |
          set -euo pipefail
          for t in user point_transaction shop_order page_view_event system_config; do
            n="$(docker exec $MYSQL_CID mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B information_schema \
              -e "SELECT COUNT(*) FROM tables WHERE table_schema='guard' AND table_name='$t';" 2>/dev/null)"
            [ "$n" = "1" ] || { echo "✗ 缺表: $t"; exit 1; }
          done
          echo "✓ 核心表齐备"
        env:
          MYSQL_CID: ${{ job.services.mysql.id }}
      - name: 运行时幂等重放(放行名单外的新迁移必须可重放)
        run: |
          set -euo pipefail
          allow="$(mktemp)"
          grep -v '^#' scripts/ci/migration-idempotency-allowlist.txt | grep -v '^$' | sort > "$allow"
          new="$(ls -1 prisma/schema-business/migrations | grep -v '^migration_lock.toml$' | sort | comm -23 - "$allow")"
          if [ -z "$new" ]; then
            echo "无放行名单外的新迁移,跳过"
            exit 0
          fi
          echo "新迁移: $new"
          for m in $new; do
            echo "重放: $m"
            pnpm exec prisma db execute --file "prisma/schema-business/migrations/$m/migration.sql" \
              --schema prisma/schema-business/schema.prisma
          done
        env:
          DATABASE_URL: ${{ env.GUARD_DB_URL }}

  db-incremental-guard:
    name: 迁移守卫 / 线上基线→本次增量 无漂移
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: acore_portal
          MYSQL_USER: acore_portal
          MYSQL_PASSWORD: acore_portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      INC_DB_URL: mysql://root:root@127.0.0.1:3306/guard_inc
      FRESH_DB_URL: mysql://root:root@127.0.0.1:3306/guard_fresh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 抽线上基线(origin/main 的迁移集)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git worktree add --detach "$RUNNER_TEMP/guard-base" origin/main
          echo "基线迁移数: $(find "$RUNNER_TEMP/guard-base/prisma/schema-business/migrations" -name migration.sql | wc -l)"
      - name: 建库
        run: docker exec $MYSQL_CID mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE guard_inc; CREATE DATABASE guard_fresh;"
        env:
          MYSQL_CID: ${{ job.services.mysql.id }}
      - name: 增量路径(先基线,再本分支)
        run: |
          set -euo pipefail
          pnpm exec prisma migrate deploy --schema "$RUNNER_TEMP/guard-base/prisma/schema-business/schema.prisma"
          pnpm exec prisma migrate deploy --schema prisma/schema-business/schema.prisma
        env:
          DATABASE_URL: ${{ env.INC_DB_URL }}
      - name: 从零路径(本分支全量)
        run: pnpm exec prisma migrate deploy --schema prisma/schema-business/schema.prisma
        env:
          DATABASE_URL: ${{ env.FRESH_DB_URL }}
      - name: 断言增量与从零一致
        run: |
          set -euo pipefail
          pnpm exec prisma migrate diff --from-url "$INC_DB_URL" \
            --to-schema-datamodel prisma/schema-business/schema.prisma --exit-code
          pnpm exec prisma migrate diff --from-url "$FRESH_DB_URL" \
            --to-schema-datamodel prisma/schema-business/schema.prisma --exit-code
          pnpm exec prisma migrate diff --from-url "$INC_DB_URL" --to-url "$FRESH_DB_URL" --exit-code
      - name: 断言迁移集合一致
        run: |
          set -euo pipefail
          docker exec $MYSQL_CID mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B guard_inc \
            -e "SELECT migration_name FROM _prisma_migrations ORDER BY migration_name;" 2>/dev/null > /tmp/inc.txt
          docker exec $MYSQL_CID mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B guard_fresh \
            -e "SELECT migration_name FROM _prisma_migrations ORDER BY migration_name;" 2>/dev/null > /tmp/fresh.txt
          diff -u /tmp/inc.txt /tmp/fresh.txt || { echo "✗ 增量与从零的迁移集合不一致"; exit 1; }
          expected="$(find prisma/schema-business/migrations -name migration.sql | wc -l | tr -d ' ')"
          got="$(wc -l < /tmp/inc.txt | tr -d ' ')"
          echo "迁移集合: 增量=$got 从零=$(wc -l < /tmp/fresh.txt | tr -d ' ') 期望=$expected"
          [ "$got" = "$expected" ] || { echo "✗ 增量路径未覆盖全部迁移"; exit 1; }
        env:
          MYSQL_CID: ${{ job.services.mysql.id }}

  # ============================================================
  # 镜像构建推送(可复用工作流;构建语义只有一份)
  # ============================================================
  docker-release:
    name: 构建并推送镜像
    needs: [check, build, integration, db-migration-guard, db-incremental-guard]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-image.yml
    with:
      image: acore-portal
      dockerfile: docker/web/Dockerfile
      # 测试栈在 arm64(Mac Mini)原生、生产栈在 x86_64 Linux 原生:不做交叉模拟
      platform: ${{ github.ref == 'refs/heads/main' && 'linux/amd64' || 'linux/arm64' }}
      build-meta: true
    # 可复用工作流默认**不继承**仓库 secret:不写这行,被调工作流里的
    # secrets.TCR_* 全为空 → 推镜像时 "Username and password required"。
    secrets: inherit

  # ============================================================
  # 测试环境自动部署(push develop;自托管 runner 落 Mac Mini 常驻栈)
  # ============================================================
  deploy-staging:
    name: deploy(测试环境发布)
    needs: [docker-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted]
    timeout-minutes: 60
    # 部署串行:两次部署撞车会留下半新半旧的栈
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: portal
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      DEPLOY_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: portal
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # 测试环境拉镜像走 TCR,登录凭证与发布线同一套(repo secrets)
      - name: 登录 TCR
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: 前置校验
        run: |
          set -eu
          [ -n "$DEPLOY_ROOT" ] || { echo "ERROR: 未配置仓库变量 DEPLOY_ROOT" >&2; exit 1; }
          [ -d "$DEPLOY_ROOT" ] || { echo "ERROR: 部署根不存在:$DEPLOY_ROOT" >&2; exit 1; }
          [ -f "$DEPLOY_ROOT/scripts/deploy.sh" ] || { echo "ERROR: $DEPLOY_ROOT/scripts/deploy.sh 不存在" >&2; exit 1; }
          [ -f "$DEPLOY_ROOT/.env.test" ] || { echo "ERROR: $DEPLOY_ROOT/.env.test 不存在,先准备测试环境配置" >&2; exit 1; }
      - name: 发布(钉镜像 → 迁移 → 换容器 → 健康检查 → 失败回滚 → 镜像清理)
        # 部署脚本取工作副本里的版本(与 aitech-hub 同款口径);应用代码取 CI 镜像。
        # CI 不往工作副本写源码文件,免得覆盖本地未提交改动——只写 .deploy-state 与 env 的镜像钉。
        run: bash "$DEPLOY_ROOT/scripts/deploy.sh" --env staging --tag "develop-${{ steps.vars.outputs.sha_short }}"

  # ============================================================
  # 生产环境发布(**人工在 GitHub 上确认才部署**)
  # 仓库为 public,生产机地址与部署路径一律走仓库变量(不入库);SSH 密钥与主机指纹
  # 走仓库 secret。资产由 CI 侧打包直传(生产机到 GitHub 的链路实测超时,不能让
  # 服务器侧拉取)——与 git checkout 等价(同一 commit)。
  #
  # 触发口径:main 合并只**构建镜像**(docker-release),部署不动;发布由
  # workflow_dispatch 手动触发 —— 人须在 Actions 页点 Run workflow 确认,
  # 这就是「生产部署须人工确认」的门。挂 environment: production 提供部署记录与
  # 日志;若该环境另配了 required reviewer,则是双保险(不冲突)。
  # ============================================================
  deploy-production:
    name: deploy(生产环境发布)
    needs: [docker-release]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: 前置校验(未配密钥/主机则明确失败,不半途发布)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "ERROR: 未配置仓库 secret DEPLOY_SSH_KEY" >&2; exit 1; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "ERROR: 未配置仓库 secret DEPLOY_KNOWN_HOSTS" >&2; exit 1; }
          [ -n "$DEPLOY_HOST" ] || { echo "ERROR: 未配置仓库变量 DEPLOY_HOST" >&2; exit 1; }
          [ -n "$DEPLOY_PATH" ] || { echo "ERROR: 未配置仓库变量 DEPLOY_PATH" >&2; exit 1; }
      - name: 配置免密密钥与主机指纹
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: 预检生产机(部署目录与 compose 插件)
        run: |
          set -eu
          # 生产机必须有 compose v2 CLI 插件:只装了独立二进制 docker-compose 时
          # `docker compose` 不可用,现场步骤会以 exit 125 崩掉,报错还指向"拉取失败"。
          # 这里先一步拦下,报错直指缺插件。
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' || { echo 'ERROR: 部署目录不存在:$DEPLOY_PATH' >&2; exit 1; }; sudo docker compose version >/dev/null 2>&1 || { echo 'ERROR: 生产机缺少 compose v2 CLI 插件(docker compose 不可用)' >&2; exit 1; }; echo '生产机预检通过'"
      - name: 记录发布前现场
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && echo '--- 当前状态文件 ---' && cat .deploy-state 2>/dev/null; echo '--- 当前镜像钉 ---' && grep -E '^WEB_IMAGE=' .env.prod 2>/dev/null; echo '--- 当前运行镜像 ---' && sudo docker compose --env-file .env.prod -f docker/docker-compose.prod.yml ps --format '{{.Service}} {{.Image}} {{.State}}' 2>/dev/null"
      - name: 同步部署资产到服务器
        run: |
          set -eu
          # COPYFILE_DISABLE:macOS 上打包不夹带 AppleDouble(._*)垃圾文件
          COPYFILE_DISABLE=1 tar -czf /tmp/deploy-assets.tar.gz \
            scripts/deploy.sh \
            docker/docker-compose.prod.yml \
            docker/caddy/Caddyfile \
            docker/web/Dockerfile
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            /tmp/deploy-assets.tar.gz "$DEPLOY_HOST:/tmp/deploy-assets.tar.gz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            sudo bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          cd "$1"
          # --no-same-owner:不让归档里的 uid/gid 覆盖服务器属主
          tar --no-same-owner -xzf /tmp/deploy-assets.tar.gz
          rm -f /tmp/deploy-assets.tar.gz
          chmod 755 scripts/deploy.sh
          printf '%s\n' "$2" > .deploy-commit
          # 资产落地完整性校验:缺任何一项都中止,不带着半套资产继续发布
          for f in scripts/deploy.sh docker/docker-compose.prod.yml docker/caddy/Caddyfile docker/web/Dockerfile; do
              [ -f "$f" ] || { echo "ERROR: 资产缺失:$f" >&2; exit 1; }
          done
          echo "--- 已同步:发布资产齐全 ---"
          REMOTE
      - name: 发布(钉镜像 → 迁移 → 换容器 → 健康检查 → 失败回滚 → 镜像清理)
        run: |
          set -eu
          # 命名空间随命令传到服务器侧脚本(ssh 不继承 runner 的 env,须显式带)
          # tag:workflow_dispatch 输入优先(可重发历史版本),否则用当前 main 提交短号
          TAG="${{ inputs.deploy_tag }}"
          [ -n "$TAG" ] || TAG="main-${{ steps.vars.outputs.sha_short }}"
          echo "发布目标镜像 tag:$TAG"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sudo DEPLOY_NAMESPACE='$DEPLOY_NAMESPACE' bash scripts/deploy.sh --env prod --tag '$TAG'"


