# E2E(Playwright)流水线
#
# 与 CI 三档(check/build/integration)分开的理由:需浏览器 + 邮件替身,
# 耗时与 flake 面都高一档,拆开便于按需停用而不拖累 PR 反馈。
#
# 两档并行跑(matrix):
#   off —— 关态基线(无人机验证)
#   on  —— 开态档(Turnstile 官方测试密钥:widget 自动通过 / siteverify 恒真)
#          与本地 `pnpm test:e2e:turnstile` 同量级
#
# 关键口径:
# - 用 `next start` 跑**生产构建**,不用 `next dev`:dev 按需编译的首请求尖峰
#   (10–15s)会打乱跑测节奏,生产构建无此开销(顺带把 build 产物也验证了一遍);
# - 配置是**进程内快照**,故播种必须发生在启动之前,两档之间要重启应用;
# - 种子/路由映射/阈值放宽复用 tests/e2e/global-setup.ts 的同一份 seed();
#   防滥用阈值放宽(E2E 全部请求同一出口 IP)也在那份 SECURITY_E2E 里,
#   由 pre-seed 在启动前落库 —— 集成档不共用这套放宽(它要断言生产档阈值)。
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://acore_portal:acore_portal@127.0.0.1:3306/acore_portal
  REDIS_URL: redis://127.0.0.1:6379/0
  SESSION_SECRET: ci-only-dummy-secret-value-0001
  MYSQL_ROOT_PASSWORD: root
  CI_MYSQL_PORT: "3306"
  APP_URL: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: "1"
  # 应用由本档自行启动(planning:见下),跳过 Playwright 的 webServer 托管
  E2E_SKIP_WEBSERVER: "1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: off
            turnstile: "0"
          - mode: on
            turnstile: "1"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: acore_portal
          MYSQL_USER: acore_portal
          MYSQL_PASSWORD: acore_portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025 # SMTP(应用发信)
          - 8025:8025 # HTTP API(用例读验证码/激活链接)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成 Prisma 客户端
        run: pnpm db:generate
      - name: 游戏四库结构与账号
        run: bash scripts/ci/provision.sh game
        env:
          MYSQL_CID: ${{ job.services.mysql.id }}
      - name: 业务库迁移
        run: pnpm db:deploy
      - name: system_config 基线
        run: bash scripts/ci/provision.sh config
        env:
          MYSQL_CID: ${{ job.services.mysql.id }}
      - name: 开发种子
        run: pnpm db:seed
      - name: 启动 SOAP mock
        run: |
          SOAP_MOCK_PORT=17878 node scripts/dev/soap-mock.mjs > /tmp/soap-mock.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:17878/__mode > /dev/null; then echo "soap-mock 就绪"; exit 0; fi
            sleep 1
          done
          echo "soap-mock 未就绪"; cat /tmp/soap-mock.log; exit 1
      - name: 安装浏览器
        run: pnpm exec playwright install --with-deps chromium
      - name: 生产构建
        run: pnpm build
      - name: 播种(配置/路由映射/阈值;配置是进程内快照,须在启动前落库)
        run: tsx tests/e2e/pre-seed.ts
        env:
          E2E_TURNSTILE: ${{ matrix.turnstile }}
      - name: 启动应用并等待就绪
        run: |
          nohup pnpm start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/status > /dev/null; then echo "应用就绪"; exit 0; fi
            sleep 2
          done
          echo "应用未就绪"; tail -50 /tmp/app.log; exit 1
      - name: 跑 E2E
        run: pnpm exec playwright test
        env:
          E2E_TURNSTILE: ${{ matrix.turnstile }}
      - name: 失败时收集应用日志
        if: failure()
        run: tail -100 /tmp/app.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace-${{ matrix.mode }}
          path: /tmp/acore-portal-e2e-artifacts
          retention-days: 3
