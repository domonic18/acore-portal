# 质量门禁:lint + typecheck + 单元测试
# 集成/E2E 依赖 Mac Mini 常驻 MySQL 栈(docker/docker-compose.test.yml),不在 CI 复刻;
# CI 全绿(check_suite success)即控制台 M3.9-2 待验收判定的口径。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成 Prisma 客户端(typecheck 依赖 src/generated)
        run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/unit
